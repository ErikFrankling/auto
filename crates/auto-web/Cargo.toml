[package]
name = "auto-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
auto-app = { path = "../auto-app" }
auto-core = { path = "../auto-core" }
wgpu.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Performance", "HtmlCanvasElement"] }
js-sys = "0.3"
serde_json.workspace = true
